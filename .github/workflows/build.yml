name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest stable tag
        id: tag
        run: |
          LATEST=$(curl -s "https://api.github.com/repos/ahXN00/OwnTV/tags" | grep -oP '"name":\s*"\K[^"]+' | head -1)
          echo "tag=$LATEST" >> $GITHUB_OUTPUT

      - name: Checkout upstream OwnTV
        uses: actions/checkout@v4
        with:
          repository: ahXN00/OwnTV
          ref: ${{ steps.tag.outputs.tag }}
          path: source
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install ImageMagick and jq
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick fonts-dejavu jq

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-v6-${{ steps.tag.outputs.tag }}-${{ hashFiles('source/**/*.gradle*', 'source/**/gradle-wrapper.properties') }}
          restore-keys: sttiten-v6-${{ steps.tag.outputs.tag }}-

      # ============================================================
      # 🔍 تشخيص كامل قبل أي تعديل
      # ============================================================
      - name: Diagnostic - full inspection
        working-directory: source
        run: |
          echo "========== [1] محتوى locales.json =========="
          find . -name "locales.json" -not -path "*/build/*" | while read f; do
            echo "--- FILE: $f ---"
            cat "$f"
            echo ""
          done
          
          echo "========== [2] build.gradle.kts حول سطر 458 =========="
          if [ -f build.gradle.kts ]; then
            echo "--- build.gradle.kts (lines 440-480) ---"
            sed -n '440,480p' build.gradle.kts
          fi
          if [ -f app/build.gradle.kts ]; then
            echo "--- app/build.gradle.kts (lines 440-480) ---"
            sed -n '440,480p' app/build.gradle.kts
          fi
          
          echo "========== [3] wordmark files =========="
          find . -name "*wordmark*" -not -path "*/build/*" -exec echo "--- {} ---" \; -exec cat {} \; 2>/dev/null
          
          echo "========== [4] نصوص about/developer =========="
          grep -rn 'name="[^"]*about[^"]*"\|name="[^"]*developer[^"]*"\|name="[^"]*credit[^"]*"\|name="[^"]*author[^"]*"' --include="strings.xml" . 2>/dev/null | head -40
          
          echo "========== [5] مراجع telegram_qr =========="
          grep -rn "telegram_qr" --include="*.kt" --include="*.xml" . 2>/dev/null | head -20 || echo "لا يوجد"

      # ============================================================
      # ✂️ المهمة 1: تقييد اللغة العربية (باستخدام jq)
      # ============================================================
      - name: Restrict to Arabic only (safe jq filter)
        working-directory: source
        run: |
          find . -name "locales.json" -not -path "*/build/*" | while read f; do
            echo "--- معالجة: $f ---"
            cp "$f" "$f.bak"
            
            # كشف البنية
            TYPE=$(jq -r 'type' "$f" 2>/dev/null || echo "unknown")
            echo "النوع: $TYPE"
            
            if [ "$TYPE" = "object" ]; then
              # إذا كان Map: نبقي فقط المفتاح "ar"
              jq '{ar: .ar}' "$f" > "$f.tmp" 2>/dev/null
            elif [ "$TYPE" = "array" ]; then
              # إذا كان Array: نبقي فقط العناصر التي code/ar فيها
              jq '[.[] | select((.code // .locale // .language // "") == "ar")]' "$f" > "$f.tmp" 2>/dev/null
            else
              cp "$f" "$f.tmp"
            fi
            
            # التحقق: هل الملف الجديد غير فارغ؟
            if [ -s "$f.tmp" ] && jq -e . "$f.tmp" > /dev/null 2>&1; then
              mv "$f.tmp" "$f"
              echo "✅ تم التعديل:"
              cat "$f"
            else
              # إرجاع النسخة الأصلية في حال الفشل
              mv "$f.bak" "$f"
              echo "⚠️ فشل التعديل، تم إرجاع الأصل"
            fi
            rm -f "$f.bak" "$f.tmp"
          done

      # ============================================================
      # ✂️ المهمة 2: إزالة Telegram QR
      # ============================================================
      - name: Remove Telegram QR
        working-directory: source
        run: |
          find . -name "telegram_qr.jpg" -delete
          find . -name "telegram_qr.png" -delete
          find . -name "telegram_qr.xml" -delete
          find . -name "*.kt" -exec sed -i 's|R\.drawable\.telegram_qr|R.drawable.owntv_wordmark_own|g' {} + 2>/dev/null || true
          find . -name "*.xml" -exec sed -i 's|@drawable/telegram_qr|@drawable/owntv_wordmark_own|g' {} + 2>/dev/null || true
          echo "✅ تم حذف Telegram QR"

      # ============================================================
      # ✂️ المهمة 3: إنشاء اللوجو الجديد
      # ============================================================
      - name: Create STTITEN IP TV logo
        working-directory: source
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/drawable
          
          convert -size 1200x300 xc:transparent \
            -font DejaVu-Sans-Bold -pointsize 110 \
            -fill "#FFFFFF" -gravity center \
            -annotate +0+0 "STTITEN IP TV" \
            app/src/main/res/drawable-nodpi/sttiten_logo.png
          
          ls -la app/src/main/res/drawable-nodpi/sttiten_logo.png
          
          cat > app/src/main/res/drawable/owntv_wordmark_own.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/sttiten_logo"
              android:gravity="center" />
          EOF
          
          cat > app/src/main/res/drawable/owntv_wordmark_tv.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <size android:width="0dp" android:height="0dp" />
              <solid android:color="#00000000" />
          </shape>
          EOF
          
          echo "✅ تم إنشاء اللوجو واستبدال wordmark"

      # ============================================================
      # ✂️ المهمة 4: تغيير الاسم في كل مكان
      # ============================================================
      - name: Change App Name
        working-directory: source
        run: |
          find . -name "strings.xml" -exec sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">STTITEN IP TV</string>|g' {} +
          find . -name "*.kt" -exec sed -i 's|"OwnTV"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"Own TV"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"Own Tv"|"STTITEN IP TV"|g' {} +
          echo "✅ تم تغيير الاسم"

      # ============================================================
      # ✂️ المهمة 5: قسم "حول"
      # ============================================================
      - name: Replace About section
        working-directory: source
        run: |
          for KEY in developer_name developer developer_credit about_developer \
                     settings_developer_name settings_about_developer \
                     settings_about_developer_name author created_by app_author \
                     settings_about_developer_credit about_credits; do
            find . -name "strings.xml" -exec sed -i "s|<string name=\"$KEY\">[^<]*</string>|<string name=\"$KEY\">جلولي مصطفى</string>|g" {} +
          done
          echo "✅ تم تحديث مفاتيح المطور"
          grep -rn "جلولي مصطفى" --include="strings.xml" . 2>/dev/null | head -10 || echo "لم يتم العثور على مفتاح معروف"

      # ============================================================
      # Build
      # ============================================================
      - name: Setup Gradle properties
        working-directory: source
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Grant execute permission for gradlew
        working-directory: source
        run: chmod +x gradlew

      - name: Build ARM APK
        working-directory: source
        run: ./gradlew assembleStandardDebug --stacktrace --no-daemon --no-parallel

      - name: Upload ARM APK
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-ARM-APK
          path: 'source/app/build/outputs/apk/standard/debug/*.apk'
          if-no-files-found: error
