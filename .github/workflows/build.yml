name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ تم التعديل إلى Java 21 بناءً على متطلبات مشروعك
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || \
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || \
          echo "تخطي تثبيت المكونات، سيتم استخدام الموجود"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Enable 32-bit and 64-bit Architectures
        run: |
          find . -name "build.gradle" -path "*/app/*" -exec awk '/android {/{print; print "    ndk { abiFilters \"armeabi-v7a\", \"arm64-v8a\" }"; next}1' {} > {}.tmp && mv {}.tmp {} \;
          echo "✅ تم تفعيل دعم 32-bit و 64-bit"

      - name: Change App Name to STTITEN IP TV
        run: |
          find . -name "strings.xml" -exec sed -i 's|<string name="app_name">.*</string>|<string name="app_name">STTITEN IP TV</string>|g' {} +
          echo "✅ تم تغيير الاسم إلى STTITEN IP TV"

      - name: Setup Gradle properties
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties
          echo "android.nonTransitiveRClass=false" >> gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew assembleDebug \
            -x lint \
            -x lintStandardDebug \
            -x test \
            -x testStandardDebugUnitTest \
            -x verifyI18nLiterals \
            -x check \
            --stacktrace \
            --no-daemon \
            --no-parallel

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-Debug-APK
          path: '**/*.apk'
          if-no-files-found: error
