name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest stable tag
        id: tag
        run: |
          LATEST=$(curl -s "https://api.github.com/repos/ahXN00/OwnTV/tags" | grep -oP '"name":\s*"\K[^"]+' | head -1)
          echo "tag=$LATEST" >> $GITHUB_OUTPUT

      - name: Checkout upstream OwnTV
        uses: actions/checkout@v4
        with:
          repository: ahXN00/OwnTV
          ref: ${{ steps.tag.outputs.tag }}
          path: source
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install ImageMagick and jq
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick fonts-dejavu jq unzip zip

      - name: Get core version from toml
        id: corever
        working-directory: source
        run: |
          VERSION=$(grep -E '^owntvCore = ' gradle/libs.versions.toml | grep -oP '"\K[^"]+')
          echo "version=$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # ============================================================
      # 🔥 الأهم: تحميل AAR وتعديل شعاراته
      # ============================================================
      - name: Download and modify core AAR
        working-directory: source
        run: |
          VERSION="${{ steps.corever.outputs.version }}"
          URL="https://ahxn00.github.io/OwnTV_Core/maven/tv/own/owntv/core/$VERSION/core-$VERSION.aar"
          
          echo "===== تحميل AAR: $URL ====="
          curl -fsSL "$URL" -o /tmp/core-original.aar
          ls -la /tmp/core-original.aar
          
          echo ""
          echo "===== فك AAR ====="
          rm -rf /tmp/core-extract
          mkdir -p /tmp/core-extract
          cd /tmp/core-extract
          unzip -o /tmp/core-original.aar > /dev/null
          
          echo "===== محتويات AAR ====="
          ls -la
          
          echo ""
          echo "===== ملفات الشعار ====="
          find res -type f \( -name "*owntv*" -o -name "*wordmark*" -o -name "*mark_*" -o -name "*splash*" -o -name "*banner*" \) 2>/dev/null | sort

      - name: Replace logos inside AAR
        run: |
          cd /tmp/core-extract
          
          echo "===== عرض محتوى owntv_wordmark_own.xml الأصلي ====="
          cat res/drawable/owntv_wordmark_own.xml 2>/dev/null | head -30 || echo "لا يوجد"
          
          # إنشاء شعار STTITEN IP TV بصيغة PNG
          mkdir -p res/drawable-nodpi
          convert -size 1200x300 xc:transparent \
            -font DejaVu-Sans-Bold -pointsize 110 \
            -fill "#FFFFFF" -gravity center \
            -annotate +0+0 "STTITEN IP TV" \
            res/drawable-nodpi/sttiten_logo.png
          
          # إنشاء أيقونة مربعة
          convert -size 512x512 xc:"#0E1116" \
            -font DejaVu-Sans-Bold -pointsize 90 \
            -fill "#FFFFFF" -gravity center \
            -annotate +0+0 "STTITEN" \
            res/drawable-nodpi/sttiten_icon.png
          
          # استبدال كل ملفات wordmark و mark و splash بـ bitmap
          find res -type f \( -name "*owntv_wordmark*" -o -name "*owntv_mark*" -o -name "*owntv_splash*" \) -name "*.xml" | while read f; do
            echo "=== استبدال: $f ==="
            cat > "$f" << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/sttiten_logo"
              android:gravity="center" />
          XMLEOF
          done
          
          # استبدال الأيقونات (banner + icons)
          find res -type f \( -name "*owntv_icon*" -o -name "*owntv_banner*" \) -name "*.xml" | while read f; do
            echo "=== استبدال: $f ==="
            cat > "$f" << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/sttiten_icon"
              android:gravity="center" />
          XMLEOF
          done
          
          # استبدال أي PNG موجود
          find res -type f -name "*owntv*" -name "*.png" | while read f; do
            cp res/drawable-nodpi/sttiten_logo.png "$f"
          done
          
          echo ""
          echo "===== التحقق ====="
          cat res/drawable/owntv_wordmark_own.xml 2>/dev/null || echo "تم الحذف أو استبدال"

      - name: Repack modified AAR
        run: |
          cd /tmp/core-extract
          
          # إعادة ضغط AAR
          rm -f /tmp/core-modified.aar
          zip -r /tmp/core-modified.aar . -x "*.DS_Store" > /dev/null
          
          ls -la /tmp/core-modified.aar
          
          # نسخ إلى المشروع
          mkdir -p "$GITHUB_WORKSPACE/source/app/libs"
          cp /tmp/core-modified.aar "$GITHUB_WORKSPACE/source/app/libs/core-modified.aar"
          
          echo "✅ تم إعادة تجميع AAR"

      # ============================================================
      # ✂️ تعديل build.gradle.kts لاستخدام AAR المحلي
      # ============================================================
      - name: Point build.gradle to local AAR
        working-directory: source
        run: |
          APP_GRADLE="app/build.gradle.kts"
          
          echo "===== قبل التعديل ====="
          grep -n "owntv\|core" "$APP_GRADLE" | head -20
          
          # استبدال dependency core بـ AAR المحلي
          sed -i 's|implementation(libs.owntv.core)|implementation(files("libs/core-modified.aar"))|g' "$APP_GRADLE"
          sed -i 's|implementation(libs.owntvCore)|implementation(files("libs/core-modified.aar"))|g' "$APP_GRADLE"
          sed -i 's|api(libs.owntv.core)|implementation(files("libs/core-modified.aar"))|g' "$APP_GRADLE"
          sed -i 's|api(libs.owntvCore)|implementation(files("libs/core-modified.aar"))|g' "$APP_GRADLE"
          
          echo ""
          echo "===== بعد التعديل ====="
          grep -n "core-modified\|owntv" "$APP_GRADLE" | head -20
          
          # إضافة flatDir repo إذا لزم
          if ! grep -q "flatDir" "$APP_GRADLE"; then
            echo "⚠️ لا يوجد flatDir، سنستخدم files مباشرة"
          fi

      # ============================================================
      # ✂️ إزالة Telegram QR
      # ============================================================
      - name: Remove Telegram QR
        working-directory: source
        run: |
          find . -name "telegram_qr.*" -delete
          find . -name "*.kt" -exec sed -i 's|R\.drawable\.telegram_qr|R.drawable.sttiten_logo|g' {} + 2>/dev/null || true
          find . -name "*.xml" -exec sed -i 's|@drawable/telegram_qr|@drawable/sttiten_logo|g' {} + 2>/dev/null || true
          echo "✅ تم حذف Telegram QR"

      # ============================================================
      # ✂️ تغيير الاسم في كل مكان
      # ============================================================
      - name: Change App Name everywhere
        working-directory: source
        run: |
          find . -name "strings.xml" -exec sed -i 's|<string name="app_name">.*</string>|<string name="app_name">STTITEN IP TV</string>|g' {} +
          find . -name "strings.xml" -exec sed -i 's|<string name="app_name" translatable="false">.*</string>|<string name="app_name" translatable="false">STTITEN IP TV</string>|g' {} +
          find . -name "*.kt" -exec sed -i 's|"OwnTV"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"Own TV"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"Own Tv"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"OwnTv"|"STTITEN IP TV"|g' {} +
          find . -name "*.xml" -exec sed -i 's|>OwnTV<|>STTITEN IP TV<|g' {} +
          find . -name "*.xml" -exec sed -i 's|>Own TV<|>STTITEN IP TV<|g' {} +
          echo "✅ تم"

      # ============================================================
      # ✂️ قسم "حول التطبيق"
      # ============================================================
      - name: Replace About section
        working-directory: source
        run: |
          for KEY in developer_name developer developer_credit about_developer \
                     settings_developer_name settings_about_developer \
                     settings_about_developer_name author created_by app_author \
                     settings_about_developer_credit about_credits about_author; do
            find . -name "strings.xml" -exec sed -i "s|<string name=\"$KEY\">[^<]*</string>|<string name=\"$KEY\">جلولي مصطفى</string>|g" {} +
          done
          echo "✅ تم"

      # ============================================================
      # ✂️ دعم العربية فقط
      # ============================================================
      - name: Restrict to Arabic only
        working-directory: source
        run: |
          find . -name "locales.json" -not -path "*/build/*" | while read f; do
            cp "$f" "$f.bak"
            TYPE=$(jq -r 'type' "$f" 2>/dev/null || echo "unknown")
            if [ "$TYPE" = "object" ]; then
              jq 'with_entries(select(.key | startswith("ar")))' "$f" > "$f.new" 2>/dev/null
            elif [ "$TYPE" = "array" ]; then
              jq '[.[] | select(((.code // .tag // .locale // "") | startswith("ar")))]' "$f" > "$f.new" 2>/dev/null
            else
              cp "$f" "$f.new"
            fi
            if [ -s "$f.new" ] && jq -e . "$f.new" > /dev/null 2>&1; then
              mv "$f.new" "$f"
            else
              mv "$f.bak" "$f"
            fi
            rm -f "$f.bak" "$f.new"
          done
          echo "✅ تم"

      # ============================================================
      # Build
      # ============================================================
      - name: Setup Gradle properties
        working-directory: source
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Grant execute permission for gradlew
        working-directory: source
        run: chmod +x gradlew

      - name: Build ARM APK
        working-directory: source
        run: ./gradlew assembleStandardDebug --stacktrace --no-daemon --no-parallel

      - name: Upload ARM APK
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-ARM-APK
          path: 'source/app/build/outputs/apk/standard/debug/*.apk'
          if-no-files-found: error
