name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest stable tag
        id: tag
        run: |
          LATEST=$(curl -s "https://api.github.com/repos/ahXN00/OwnTV/tags" | grep -oP '"name":\s*"\K[^"]+' | head -1)
          echo "الوسم المستخدم: $LATEST"
          echo "tag=$LATEST" >> $GITHUB_OUTPUT

      - name: Checkout upstream OwnTV (stable tag)
        uses: actions/checkout@v4
        with:
          repository: ahXN00/OwnTV
          ref: ${{ steps.tag.outputs.tag }}
          path: source
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || \
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || \
          echo "تخطي"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-v2-${{ steps.tag.outputs.tag }}-${{ hashFiles('source/**/*.gradle*', 'source/**/gradle-wrapper.properties') }}
          restore-keys: sttiten-v2-${{ steps.tag.outputs.tag }}-

      # ✅ الخطوة الأهم: تغيير الاسم في كل مكان
      - name: Change App Name to STTITEN IP TV (everywhere)
        working-directory: source
        run: |
          echo "========== قبل التعديل: البحث عن OwnTV =========="
          echo "--- في strings.xml ---"
          grep -rln "OwnTV\|Own TV\|Own Tv" --include="strings.xml" . | head -20 || echo "لا يوجد"
          
          echo "--- في ملفات Kotlin (نصوص حرفية) ---"
          grep -rln '"OwnTV"\|"Own TV"\|"Own Tv"' --include="*.kt" . | head -20 || echo "لا يوجد"
          
          echo ""
          echo "========== تطبيق التعديلات =========="
          
          # 1. تعديل strings.xml في كل اللغات
          find . -name "strings.xml" -exec sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">STTITEN IP TV</string>|g' {} +
          echo "✅ تم تعديل strings.xml"
          
          # 2. تعديل النصوص الحرفية في Kotlin (فقط داخل " ")
          find . -name "*.kt" -exec sed -i 's|"OwnTV"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"Own TV"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"Own Tv"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"OwnTV "|"STTITEN IP TV "|g' {} +
          find . -name "*.kt" -exec sed -i 's|" OwnTV"|" STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"Own TV "|"STTITEN IP TV "|g' {} +
          find . -name "*.kt" -exec sed -i 's|" Own TV"|" STTITEN IP TV"|g' {} +
          echo "✅ تم تعديل ملفات Kotlin"
          
          # 3. التحقق من عدم بقاء أي نصوص
          echo ""
          echo "========== بعد التعديل: التحقق =========="
          echo "--- ما زال يحتوي على OwnTV في strings.xml: ---"
          grep -rn ">OwnTV<\|>Own TV<" --include="strings.xml" . | head -5 || echo "لا شيء ✅"
          
          echo "--- ما زال يحتوي على \"OwnTV\" في Kotlin: ---"
          grep -rn '"OwnTV"\|"Own TV"\|"Own Tv"' --include="*.kt" . | head -5 || echo "لا شيء ✅"
          
          # 4. عرض بعض النصوص التي تم تعديلها للتأكد
          echo ""
          echo "========== عينة من النصوص المعدلة =========="
          grep -rn "STTITEN IP TV" --include="*.kt" . | head -10

      - name: Setup Gradle properties
        working-directory: source
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Grant execute permission for gradlew
        working-directory: source
        run: chmod +x gradlew

      # ✅ بناء نسخة ARM فقط (standard flavor) — تعمل على أجهزة Android TV الحقيقية
      - name: Build ARM APK (standard flavor)
        working-directory: source
        run: |
          ./gradlew assembleStandardDebug --stacktrace --no-daemon --no-parallel

      - name: List generated APKs
        working-directory: source
        run: |
          echo "========== ملفات APK الناتجة =========="
          find . -name "*.apk" -type f -exec ls -lh {} \;

      # ✅ رفع نسخة ARM فقط — لا نرفع x86_64 أبداً
      - name: Upload ARM APK (STTITEN IP TV)
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-ARM-APK
          path: 'source/app/build/outputs/apk/standard/debug/*.apk'
          if-no-files-found: error
