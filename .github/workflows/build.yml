name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Install required Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # ✅ تفعيل الـ Cache لتسريع البناء بشكل كبير
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Enable 32-bit and 64-bit Architectures
        run: |
          find . -name "build.gradle" -path "*/app/*" -exec awk '/android {/{print; print "    ndk { abiFilters \"armeabi-v7a\", \"arm64-v8a\" }"; next}1' {} > {}.tmp && mv {}.tmp {} \;
          echo "✅ تم تفعيل دعم 32-bit و 64-bit"

      - name: Change App Name to STTITEN IP TV
        run: |
          find . -name "strings.xml" -exec sed -i 's|<string name="app_name">.*</string>|<string name="app_name">STTITEN IP TV</string>|g' {} +
          echo "✅ تم تغيير الاسم إلى STTITEN IP TV"

      # ✅ إصلاح مشكلة النصوص المفقودة تلقائياً
      - name: Fix Missing String Resources
        run: |
          # إنشاء ملف strings.xml الرئيسي إذا لم يكن موجوداً
          mkdir -p app/src/main/res/values
          MAIN_STRINGS="app/src/main/res/values/strings.xml"
          if [ ! -f "$MAIN_STRINGS" ]; then
            echo '<?xml version="1.0" encoding="utf-8"?>' > $MAIN_STRINGS
            echo '<resources>' >> $MAIN_STRINGS
            echo '</resources>' >> $MAIN_STRINGS
          fi
          
          # جمع جميع النصوص من جميع ملفات strings.xml في المشروع
          echo "جمع جميع النصوص المفقودة..."
          find . -name "strings.xml" -not -path "*/values/strings.xml" -exec grep -h '<string name=' {} \; 2>/dev/null | sort -u > /tmp/all_strings.txt || true
          
          # إضافة النصوص المفقودة إلى الملف الرئيسي
          while IFS= read -r line; do
            KEY=$(echo "$line" | grep -oP 'name="\K[^"]+' | head -1)
            if [ -n "$KEY" ] && ! grep -q "name=\"$KEY\"" $MAIN_STRINGS; then
              echo "    $line" >> $MAIN_STRINGS
            fi
          done < /tmp/all_strings.txt
          
          echo "✅ تم إصلاح النصوص المفقودة"

      - name: Setup Gradle properties
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties
          echo "android.enableJetifier=false" >> gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ✅ بناء APK مع تخطي الاختبارات و lint لتسريع العملية
      - name: Build APK (Skip Tests and Lint)
        run: |
          ./gradlew assembleDebug \
            -x lint \
            -x test \
            -x testStandardDebugUnitTest \
            -x verifyI18nLiterals \
            --stacktrace \
            --no-daemon

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-Debug-APK
          path: '**/*.apk'
          if-no-files-found: error
