name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Java 21 بناءً على متطلبات مشروعك (toolchainVersion=21)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: 'jdk'
          architecture: 'x64'

      # ✅ setup-android v4 لتجنب مشكلة حزمة 'tools' المحذوفة
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || \
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || \
          echo "تخطي تثبيت المكونات، سيتم استخدام الموجود"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Enable 32-bit and 64-bit Architectures
        run: |
          find . -name "build.gradle" -path "*/app/*" -exec awk '/android {/{print; print "    ndk { abiFilters \"armeabi-v7a\", \"arm64-v8a\" }"; next}1' {} > {}.tmp && mv {}.tmp {} \;
          echo "✅ تم تفعيل دعم 32-bit و 64-bit"

      - name: Change App Name to STTITEN IP TV
        run: |
          find . -name "strings.xml" -exec sed -i 's|<string name="app_name">.*</string>|<string name="app_name">STTITEN IP TV</string>|g' {} +
          echo "✅ تم تغيير الاسم إلى STTITEN IP TV"

      - name: Setup Gradle properties
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties
          echo "android.nonTransitiveRClass=false" >> gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Java and Gradle versions
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          ./gradlew --version

      # ✅ بناء الـ APK مع تسجيل كل شيء في ملف لالتقاط الخطأ الحقيقي
      - name: Build APK
        id: build_step
        continue-on-error: true
        run: |
          set +e
          ./gradlew assembleDebug \
            -x lint \
            -x lintStandardDebug \
            -x test \
            -x testStandardDebugUnitTest \
            -x verifyI18nLiterals \
            -x check \
            --stacktrace \
            --info \
            --console=plain \
            --no-daemon \
            --no-parallel \
            --no-configuration-cache \
            2>&1 | tee build_full_log.txt
          echo "EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV
          exit 0

      - name: Upload Full Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-log
          path: build_full_log.txt
          if-no-files-found: warn

      - name: Show Build Errors Only
        if: always()
        run: |
          echo "=========== EXIT CODE: $EXIT_CODE ==========="
          echo "=========== الأخطاء الفعلية ==========="
          grep -E "(error:|e: |FAILURE|Caused by|Unresolved|Cannot|Exception|What went wrong|> Task.*FAILED)" build_full_log.txt | head -100 || echo "لم يتم العثور على أخطاء واضحة"
          echo "=========== آخر 50 سطر ==========="
          tail -50 build_full_log.txt

      - name: Upload APK to GitHub Artifacts
        if: env.EXIT_CODE == '0'
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-Debug-APK
          path: '**/*.apk'
          if-no-files-found: error
