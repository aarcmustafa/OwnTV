name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || \
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || \
          echo "تخطي تثبيت المكونات"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Change App Name to STTITEN IP TV
        run: |
          find . -name "strings.xml" -exec sed -i 's|<string name="app_name">.*</string>|<string name="app_name">STTITEN IP TV</string>|g' {} +
          echo "✅ تم تغيير الاسم إلى STTITEN IP TV"

      - name: Add missing string resources
        run: |
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings_extra.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="content_category_restore_hidden">Hidden</string>
              <string name="content_category_restore_moved">Moved</string>
              <string name="content_category_restore_order">Order</string>
              <string name="content_category_restore_custom">Custom</string>
              <string name="content_category_restore_playlist">Playlist</string>
              <string name="content_category_restore_nothing">Nothing</string>
              <string name="content_category_restore_question">Question</string>
              <string name="settings_customize_restore_defaults">Restore defaults</string>
              <string name="settings_customize_restore_defaults_title">Restore defaults</string>
              <string name="settings_customize_restore_defaults_description">Restore defaults</string>
              <string name="player_reconnecting">Reconnecting</string>
          </resources>
          EOF

      - name: Check available core versions
        run: |
          echo "=== Available OwnTV Core versions ==="
          curl -s "https://ahxn00.github.io/OwnTV_Core/maven/tv/own/owntv/core/maven-metadata.xml" || echo "Could not fetch metadata"
          echo ""
          echo "=== Current libs.versions.toml (versions section) ==="
          grep -A 20 '\[versions\]' gradle/libs.versions.toml || echo "Could not read libs.versions.toml"

      - name: Setup Gradle properties
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties
          echo "android.nonTransitiveRClass=false" >> gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew assembleDebug --refresh-dependencies --stacktrace --no-daemon --no-parallel

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-Debug-APK
          path: '**/*.apk'
          if-no-files-found: error
