name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest stable tag
        id: tag
        run: |
          LATEST=$(curl -s "https://api.github.com/repos/ahXN00/OwnTV/tags" | grep -oP '"name":\s*"\K[^"]+' | head -1)
          echo "tag=$LATEST" >> $GITHUB_OUTPUT

      - name: Checkout upstream OwnTV
        uses: actions/checkout@v4
        with:
          repository: ahXN00/OwnTV
          ref: ${{ steps.tag.outputs.tag }}
          path: source
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install ImageMagick and jq
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick fonts-dejavu jq

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-v7-${{ steps.tag.outputs.tag }}-${{ hashFiles('source/**/*.gradle*', 'source/**/gradle-wrapper.properties') }}
          restore-keys: sttiten-v7-${{ steps.tag.outputs.tag }}-

      # ============================================================
      # 🔍 تشخيص شامل: البحث عن كل مكان يظهر فيه OwnTV
      # ============================================================
      - name: Diagnostic - Find all OwnTV occurrences
        working-directory: source
        run: |
          echo "========== [1] في AndroidManifest.xml =========="
          find . -name "AndroidManifest.xml" -exec grep -l "OwnTV\|Own TV" {} \; 2>/dev/null || echo "لا يوجد"
          find . -name "AndroidManifest.xml" -exec grep -n "OwnTV\|Own TV" {} \; 2>/dev/null || echo "لا يوجد"
          
          echo ""
          echo "========== [2] في strings.xml =========="
          find . -name "strings.xml" -exec grep -n "OwnTV\|Own TV\|Owntv\|OWNTV" {} \; 2>/dev/null | head -30 || echo "لا يوجد"
          
          echo ""
          echo "========== [3] في ملفات Kotlin =========="
          grep -rn '"OwnTV"\|"Own TV"\|"Own Tv"\|"OwnTv"' --include="*.kt" . 2>/dev/null | head -30 || echo "لا يوجد"
          
          echo ""
          echo "========== [4] في ملفات XML (layout, values) =========="
          grep -rn 'OwnTV\|Own TV\|OwnTv' --include="*.xml" . 2>/dev/null | grep -v "strings.xml" | head -30 || echo "لا يوجد"
          
          echo ""
          echo "========== [5] في build.gradle =========="
          grep -rn "app_name\|resValue" --include="*.gradle*" . 2>/dev/null | head -30 || echo "لا يوجد"
          
          echo ""
          echo "========== [6] محتوى AndroidManifest.xml الرئيسي =========="
          find . -name "AndroidManifest.xml" -path "*/app/src/main/*" -exec cat {} \; 2>/dev/null | head -100

      # ============================================================
      # ✂️ المهمة 1: إزالة Telegram QR
      # ============================================================
      - name: Remove Telegram QR
        working-directory: source
        run: |
          find . -name "telegram_qr.jpg" -delete
          find . -name "telegram_qr.png" -delete
          find . -name "telegram_qr.xml" -delete
          find . -name "*.kt" -exec sed -i 's|R\.drawable\.telegram_qr|R.drawable.owntv_wordmark_own|g' {} + 2>/dev/null || true
          find . -name "*.xml" -exec sed -i 's|@drawable/telegram_qr|@drawable/owntv_wordmark_own|g' {} + 2>/dev/null || true
          echo "✅ تم حذف Telegram QR"

      # ============================================================
      # ✂️ المهمة 2: إنشاء اللوجو الجديد
      # ============================================================
      - name: Create STTITEN IP TV logo
        working-directory: source
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/drawable
          
          convert -size 1200x300 xc:transparent \
            -font DejaVu-Sans-Bold -pointsize 110 \
            -fill "#FFFFFF" -gravity center \
            -annotate +0+0 "STTITEN IP TV" \
            app/src/main/res/drawable-nodpi/sttiten_logo.png
          
          cat > app/src/main/res/drawable/owntv_wordmark_own.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/sttiten_logo"
              android:gravity="center" />
          EOF
          
          cat > app/src/main/res/drawable/owntv_wordmark_tv.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <size android:width="0dp" android:height="0dp" />
              <solid android:color="#00000000" />
          </shape>
          EOF
          echo "✅ تم إنشاء اللوجو"

      # ============================================================
      # ✂️ المهمة 3: تغيير الاسم في AndroidManifest.xml
      # ============================================================
      - name: Change App Name in AndroidManifest.xml
        working-directory: source
        run: |
          find . -name "AndroidManifest.xml" -not -path "*/build/*" | while read f; do
            echo "--- معالجة: $f ---"
            # استبدال android:label="OwnTV" مباشرة
            sed -i 's|android:label="OwnTV"|android:label="@string/app_name"|g' "$f"
            sed -i 's|android:label="Own TV"|android:label="@string/app_name"|g' "$f"
            sed -i 's|android:label="@string/app_name"|android:label="@string/app_name"|g' "$f"
            
            # إذا كان هناك label بقيمة أخرى غير app_name، استبدلها
            sed -i 's|android:label="[^"]*"|android:label="@string/app_name"|g' "$f"
            echo "✅ تم تحديث: $f"
          done
          
          echo "===== التحقق ====="
          find . -name "AndroidManifest.xml" -not -path "*/build/*" -exec grep -n "android:label" {} \; 2>/dev/null | head -20

      # ============================================================
      # ✂️ المهمة 4: إضافة resValue في build.gradle لتجاوز أي قيمة قديمة
      # ============================================================
      - name: Add resValue to build.gradle
        working-directory: source
        run: |
          APP_GRADLE="app/build.gradle.kts"
          if [ -f "$APP_GRADLE" ]; then
            # إضافة resValue داخل defaultConfig
            if ! grep -q 'resValue("string", "app_name"' "$APP_GRADLE"; then
              perl -i -pe 's/(defaultConfig\s*\{)/$1\n        resValue("string", "app_name", "STTITEN IP TV")/' "$APP_GRADLE"
            fi
            echo "===== defaultConfig بعد التعديل ====="
            grep -A 10 "defaultConfig {" "$APP_GRADLE" | head -15
          fi
          
          if [ -f "app/build.gradle" ]; then
            if ! grep -q 'resValue "string", "app_name"' "app/build.gradle"; then
              perl -i -pe 's/(defaultConfig\s*\{)/$1\n        resValue "string", "app_name", "STTITEN IP TV"/' "app/build.gradle"
            fi
            echo "===== defaultConfig بعد التعديل ====="
            grep -A 10 "defaultConfig {" "app/build.gradle" | head -15
          fi

      # ============================================================
      # ✂️ المهمة 5: تغيير الاسم في كل مكان
      # ============================================================
      - name: Change App Name everywhere
        working-directory: source
        run: |
          # 1. strings.xml
          find . -name "strings.xml" -exec sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">STTITEN IP TV</string>|g' {} +
          
          # 2. Kotlin
          find . -name "*.kt" -exec sed -i 's|"OwnTV"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"Own TV"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"Own Tv"|"STTITEN IP TV"|g' {} +
          
          # 3. XML (layout, values, etc.)
          find . -name "*.xml" -exec sed -i 's|>OwnTV<|>STTITEN IP TV<|g' {} +
          find . -name "*.xml" -exec sed -i 's|>Own TV<|>STTITEN IP TV<|g' {} +
          find . -name "*.xml" -exec sed -i 's|>OwnTv<|>STTITEN IP TV<|g' {} +
          
          echo "✅ تم تغيير الاسم في كل مكان"
          
          # التحقق
          echo "===== ما تبقى من OwnTV ====="
          grep -rn "OwnTV\|Own TV" --include="*.kt" --include="*.xml" --include="*.gradle*" . 2>/dev/null | grep -v "build/" | head -20 || echo "لا شيء ✅"

      # ============================================================
      # ✂️ المهمة 6: قسم "حول التطبيق"
      # ============================================================
      - name: Replace About section
        working-directory: source
        run: |
          for KEY in developer_name developer developer_credit about_developer \
                     settings_developer_name settings_about_developer \
                     settings_about_developer_name author created_by app_author \
                     settings_about_developer_credit about_credits; do
            find . -name "strings.xml" -exec sed -i "s|<string name=\"$KEY\">[^<]*</string>|<string name=\"$KEY\">جلولي مصطفى</string>|g" {} +
          done
          echo "✅ تم تحديث مفاتيح المطور"

      # ============================================================
      # Build
      # ============================================================
      - name: Setup Gradle properties
        working-directory: source
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Grant execute permission for gradlew
        working-directory: source
        run: chmod +x gradlew

      - name: Build ARM APK
        working-directory: source
        run: ./gradlew assembleStandardDebug --stacktrace --no-daemon --no-parallel

      - name: Upload ARM APK
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-ARM-APK
          path: 'source/app/build/outputs/apk/standard/debug/*.apk'
          if-no-files-found: error
