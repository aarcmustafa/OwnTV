name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest stable tag
        id: tag
        run: |
          LATEST=$(curl -s "https://api.github.com/repos/ahXN00/OwnTV/tags" | grep -oP '"name":\s*"\K[^"]+' | head -1)
          echo "tag=$LATEST" >> $GITHUB_OUTPUT

      - name: Checkout upstream OwnTV
        uses: actions/checkout@v4
        with:
          repository: ahXN00/OwnTV
          ref: ${{ steps.tag.outputs.tag }}
          path: source
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install ImageMagick and jq
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick fonts-dejavu jq

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-v9-${{ steps.tag.outputs.tag }}-${{ hashFiles('source/**/*.gradle*', 'source/**/gradle-wrapper.properties') }}
          restore-keys: sttiten-v9-${{ steps.tag.outputs.tag }}-

      # ============================================================
      # 🔍 تشخيص: عرض اسم التطبيق في core
      # ============================================================
      - name: Diagnostic - core strings
        working-directory: source
        run: |
          echo "===== strings.xml في core ====="
          find core -name "strings.xml" -exec grep -l "app_name" {} \; 2>/dev/null || echo "لا يوجد"
          find core -name "strings.xml" -exec grep -n "app_name" {} \; 2>/dev/null || echo "لا يوجد app_name في core"
          
          echo ""
          echo "===== AndroidManifest.xml في core ====="
          find core -name "AndroidManifest.xml" -exec grep -n "android:label" {} \; 2>/dev/null || echo "لا يوجد"

      # ============================================================
      # ✂️ 1: تغيير app_name في كل الوحدات (app + core)
      # ============================================================
      - name: Change app_name everywhere
        working-directory: source
        run: |
          find . -name "strings.xml" -exec sed -i 's|<string name="app_name">.*</string>|<string name="app_name">STTITEN IP TV</string>|g' {} +
          find . -name "strings.xml" -exec sed -i 's|<string name="app_name" translatable="false">.*</string>|<string name="app_name" translatable="false">STTITEN IP TV</string>|g' {} +
          echo "✅ تم تغيير app_name في كل الوحدات"

      # ============================================================
      # ✂️ 2: تجاوز android:label في AndroidManifest.xml
      # ============================================================
      - name: Override android:label in AndroidManifest
        working-directory: source
        run: |
          MANIFEST="app/src/main/AndroidManifest.xml"
          
          if [ -f "$MANIFEST" ]; then
            # إضافة tools namespace إذا لم يكن موجوداً
            if ! grep -q 'xmlns:tools=' "$MANIFEST"; then
              sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android"|<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools"|' "$MANIFEST"
            fi
            
            # إضافة tools:replace إلى application
            if grep -q 'tools:replace=' "$MANIFEST"; then
              # إذا كان موجوداً، أضف android:label إليه
              sed -i 's|tools:replace="\([^"]*\)"|tools:replace="\1,android:label"|' "$MANIFEST"
            else
              # إذا لم يكن موجوداً، أضفه
              sed -i 's|<application|<application\n        tools:replace="android:label"|' "$MANIFEST"
            fi
            
            echo "===== AndroidManifest.xml بعد التعديل ====="
            grep -n "tools:replace\|android:label\|android:banner" "$MANIFEST" | head -20
          fi

      # ============================================================
      # ✂️ 3: إزالة Telegram QR
      # ============================================================
      - name: Remove Telegram QR
        working-directory: source
        run: |
          find . -name "telegram_qr.*" -delete
          find . -name "*.kt" -exec sed -i 's|R\.drawable\.telegram_qr|R.drawable.owntv_wordmark_own|g' {} + 2>/dev/null || true
          find . -name "*.xml" -exec sed -i 's|@drawable/telegram_qr|@drawable/owntv_wordmark_own|g' {} + 2>/dev/null || true
          echo "✅ تم حذف Telegram QR"

      # ============================================================
      # ✂️ 4: إنشاء اللوجو الجديد
      # ============================================================
      - name: Create STTITEN IP TV logo
        working-directory: source
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/drawable
          
          convert -size 1200x300 xc:transparent \
            -font DejaVu-Sans-Bold -pointsize 110 \
            -fill "#FFFFFF" -gravity center \
            -annotate +0+0 "STTITEN IP TV" \
            app/src/main/res/drawable-nodpi/sttiten_logo.png
          
          cat > app/src/main/res/drawable/owntv_wordmark_own.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/sttiten_logo"
              android:gravity="center" />
          EOF
          
          cat > app/src/main/res/drawable/owntv_wordmark_tv.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <size android:width="0dp" android:height="0dp" />
              <solid android:color="#00000000" />
          </shape>
          EOF
          echo "✅ تم إنشاء اللوجو"

      # ============================================================
      # ✂️ 5: تغيير الاسم في الكود
      # ============================================================
      - name: Replace OwnTV in code
        working-directory: source
        run: |
          find . -name "*.kt" -exec sed -i 's|"OwnTV"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"Own TV"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"Own Tv"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"OwnTv"|"STTITEN IP TV"|g' {} +
          find . -name "*.xml" -exec sed -i 's|>OwnTV<|>STTITEN IP TV<|g' {} +
          find . -name "*.xml" -exec sed -i 's|>Own TV<|>STTITEN IP TV<|g' {} +
          echo "✅ تم الاستبدال"

      # ============================================================
      # ✂️ 6: قسم "حول التطبيق"
      # ============================================================
      - name: Replace About developer
        working-directory: source
        run: |
          echo "===== نصوص about/developer ====="
          grep -rn 'name="[^"]*about[^"]*"\|name="[^"]*developer[^"]*"\|name="[^"]*author[^"]*"\|name="[^"]*credit[^"]*"' --include="strings.xml" . 2>/dev/null | head -40
          
          for KEY in developer_name developer developer_credit about_developer \
                     settings_developer_name settings_about_developer \
                     settings_about_developer_name author created_by app_author \
                     settings_about_developer_credit about_credits about_author; do
            find . -name "strings.xml" -exec sed -i "s|<string name=\"$KEY\">[^<]*</string>|<string name=\"$KEY\">جلولي مصطفى</string>|g" {} +
            find . -name "strings.xml" -exec sed -i "s|<string name=\"$KEY\" translatable=\"false\">[^<]*</string>|<string name=\"$KEY\" translatable=\"false\">جلولي مصطفى</string>|g" {} +
          done
          echo "✅ تم التعديل"

      # ============================================================
      # ✂️ 7: دعم العربية فقط
      # ============================================================
      - name: Restrict to Arabic only
        working-directory: source
        run: |
          find . -name "locales.json" -not -path "*/build/*" | while read f; do
            echo "--- $f ---"
            cp "$f" "$f.bak"
            TYPE=$(jq -r 'type' "$f" 2>/dev/null || echo "unknown")
            echo "النوع: $TYPE"
            if [ "$TYPE" = "object" ]; then
              jq 'with_entries(select(.key | startswith("ar")))' "$f" > "$f.new" 2>/dev/null
            elif [ "$TYPE" = "array" ]; then
              jq '[.[] | select(((.code // .tag // .locale // "") | startswith("ar")))]' "$f" > "$f.new" 2>/dev/null
            else
              cp "$f" "$f.new"
            fi
            if [ -s "$f.new" ] && jq -e . "$f.new" > /dev/null 2>&1; then
              mv "$f.new" "$f"
              echo "✅ بعد التعديل:"
              cat "$f"
            else
              mv "$f.bak" "$f"
              echo "⚠️ فشل، تم الإرجاع"
            fi
            rm -f "$f.bak" "$f.new"
          done

      # ============================================================
      # Build
      # ============================================================
      - name: Setup Gradle properties
        working-directory: source
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Grant execute permission for gradlew
        working-directory: source
        run: chmod +x gradlew

      - name: Build ARM APK
        working-directory: source
        run: ./gradlew assembleStandardDebug --stacktrace --no-daemon --no-parallel

      - name: Upload ARM APK
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-ARM-APK
          path: 'source/app/build/outputs/apk/standard/debug/*.apk'
          if-no-files-found: error
