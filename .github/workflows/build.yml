name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest stable tag
        id: tag
        run: |
          echo "==== جميع الوسوم (Tags) المتاحة ===="
          curl -s "https://api.github.com/repos/ahXN00/OwnTV/tags" | grep -oP '"name":\s*"\K[^"]+' | head -10
          
          LATEST=$(curl -s "https://api.github.com/repos/ahXN00/OwnTV/tags" | grep -oP '"name":\s*"\K[^"]+' | head -1)
          echo "الوسم المستخدم: $LATEST"
          echo "tag=$LATEST" >> $GITHUB_OUTPUT

      - name: Checkout upstream OwnTV (stable tag)
        uses: actions/checkout@v4
        with:
          repository: ahXN00/OwnTV
          ref: ${{ steps.tag.outputs.tag }}
          path: source
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || \
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || \
          echo "تخطي"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-gradle-${{ steps.tag.outputs.tag }}-${{ hashFiles('source/**/*.gradle*', 'source/**/gradle-wrapper.properties') }}
          restore-keys: sttiten-gradle-${{ steps.tag.outputs.tag }}-

      - name: Show versions in libs.versions.toml
        working-directory: source
        run: |
          echo "==== النسخ المستخدمة في هذا الوسم ===="
          grep -E "owntvCore|playerCore|libmpv" gradle/libs.versions.toml || cat gradle/libs.versions.toml

      - name: Change App Name to STTITEN IP TV
        working-directory: source
        run: |
          find . -name "strings.xml" -exec sed -i 's|<string name="app_name">.*</string>|<string name="app_name">STTITEN IP TV</string>|g' {} +
          echo "✅ تم تغيير الاسم"

      - name: Setup Gradle properties
        working-directory: source
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Grant execute permission for gradlew
        working-directory: source
        run: chmod +x gradlew

      - name: Build APK
        working-directory: source
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon --no-parallel

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-${{ steps.tag.outputs.tag }}-Debug-APK
          path: 'source/**/*.apk'
          if-no-files-found: warn
