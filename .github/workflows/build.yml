name: Build and Send APK to Telegram

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # يسمح لك بتشغيل البناء يدوياً من واجهة GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Change App Name to STTITEN IP TV
        run: |
          # البحث عن جميع ملفات strings.xml وتعديل اسم التطبيق
          find . -name "strings.xml" -path "*/values*/*" -exec sed -i 's|<string name="app_name">.*</string>|<string name="app_name">STTITEN IP TV</string>|g' {} +
          echo "تم تغيير اسم التطبيق إلى STTITEN IP TV بنجاح"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Find APK file
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "تم العثور على ملف APK في: $APK_PATH"

      - name: Send APK to Telegram
        if: steps.find_apk.outputs.apk_path != ''
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          document: ${{ steps.find_apk.outputs.apk_path }}
          message: |
            ✅ تم بناء تطبيق STTITEN IP TV بنجاح!
            📦 نوع البناء: Debug
            🔗 الإصدار: ${{ github.sha }}
