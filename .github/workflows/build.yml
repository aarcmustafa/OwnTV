name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # يسمح بتشغيل البناء يدوياً

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          # تثبيت المكونات الأساسية (يمكن تعديل الأرقام حسب build.gradle إن لزم الأمر)
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Change App Name to STTITEN IP TV
        run: |
          # 1. تعديل ملفات strings.xml (الاسم الظاهر في قائمة التطبيقات)
          find . -name "strings.xml" -exec sed -i 's|<string name="app_name">.*</string>|<string name="app_name">STTITEN IP TV</string>|g' {} +
          
          # 2. تعديل النصوص المكتوبة مباشرة داخل واجهات Kotlin (Jetpack Compose)
          find . -name "*.kt" -exec sed -i 's|"OwnTV"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"Own TV"|"STTITEN IP TV"|g' {} +
          
          # 3. تعديل النصوص في ملفات XML التقليدية (إن وجدت)
          find . -name "*.xml" -path "*/res/layout*" -exec sed -i 's|"OwnTV"|"STTITEN IP TV"|g' {} +
          find . -name "*.xml" -path "*/res/layout*" -exec sed -i 's|"Own TV"|"STTITEN IP TV"|g' {} +
          
          echo "✅ تم تغيير الاسم إلى STTITEN IP TV في جميع الواجهات"

      - name: Setup Gradle properties
        run: |
          # إعدادات لتحسين الذاكرة ومنع فشل Gradle
          echo "org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-Debug-APK
          path: '**/*.apk'
