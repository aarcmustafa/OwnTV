name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest stable tag
        id: tag
        run: |
          LATEST=$(curl -s "https://api.github.com/repos/ahXN00/OwnTV/tags" | grep -oP '"name":\s*"\K[^"]+' | head -1)
          echo "tag=$LATEST" >> $GITHUB_OUTPUT

      - name: Checkout upstream OwnTV
        uses: actions/checkout@v4
        with:
          repository: ahXN00/OwnTV
          ref: ${{ steps.tag.outputs.tag }}
          path: source
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick fonts-dejavu

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-v5-${{ steps.tag.outputs.tag }}-${{ hashFiles('source/**/*.gradle*', 'source/**/gradle-wrapper.properties') }}
          restore-keys: sttiten-v5-${{ steps.tag.outputs.tag }}-

      - name: Diagnostic - locale files
        working-directory: source
        run: |
          echo "===== [1] locales.json ====="
          find . -name "locales.json" -exec echo "--- {} ---" \; -exec cat {} \;
          
          echo ""
          echo "===== [2] localeFilters في gradle ====="
          grep -rn "localeFilters\|localeFilter" --include="*.kts" --include="*.gradle" . 2>/dev/null | head -20
          
          echo ""
          echo "===== [3] wordmark files ====="
          find . -name "*wordmark*" -exec ls -la {} \;

      # ============================================================
      # ✂️ المهمة 1: قصر اللغة على العربية فقط
      # ============================================================
      - name: Restrict to Arabic only (via locales.json)
        working-directory: source
        run: |
          # البحث عن ملف locales.json في المستودع وتعديله ليحتوي على "ar" فقط
          FOUND=0
          for FILE in $(find . -name "locales.json" -not -path "*/build/*"); do
            echo "--- تعديل $FILE ---"
            echo '["ar"]' > "$FILE"
            cat "$FILE"
            FOUND=$((FOUND+1))
          done
          
          if [ "$FOUND" -eq 0 ]; then
            echo "⚠️ لم يتم العثور على locales.json، إنشاء ملف جديد"
            mkdir -p tools/i18n
            echo '["ar"]' > tools/i18n/locales.json
          fi
          
          echo "✅ تم تفعيل اللغة العربية فقط"

      # ============================================================
      # ✂️ المهمة 2: إنشاء لوجو STTITEN IP TV واستبدال ملفي wordmark
      # ============================================================
      - name: Create STTITEN IP TV logo
        working-directory: source
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          
          convert -size 1200x300 xc:transparent \
            -font DejaVu-Sans-Bold -pointsize 110 \
            -fill "#FFFFFF" -gravity center \
            -annotate +0+0 "STTITEN IP TV" \
            app/src/main/res/drawable-nodpi/sttiten_logo.png
          
          ls -la app/src/main/res/drawable-nodpi/sttiten_logo.png
          echo "✅ تم إنشاء الشعار"
          
          mkdir -p app/src/main/res/drawable
          
          cat > app/src/main/res/drawable/owntv_wordmark_own.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/sttiten_logo"
              android:gravity="center" />
          EOF
          
          cat > app/src/main/res/drawable/owntv_wordmark_tv.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <size android:width="0dp" android:height="0dp" />
              <solid android:color="#00000000" />
          </shape>
          EOF
          
          echo "✅ تم استبدال ملفي wordmark"

      # ============================================================
      # ✂️ المهمة 3: استبدال الاسم في كل مكان
      # ============================================================
      - name: Change App Name to STTITEN IP TV
        working-directory: source
        run: |
          find . -name "strings.xml" -exec sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">STTITEN IP TV</string>|g' {} +
          find . -name "*.kt" -exec sed -i 's|"OwnTV"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"Own TV"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"Own Tv"|"STTITEN IP TV"|g' {} +
          echo "✅ تم تغيير الاسم"

      # ============================================================
      # ✂️ المهمة 4: قسم "حول التطبيق"
      # ============================================================
      - name: Replace About section
        working-directory: source
        run: |
          # سرد النصوص الحالية في about
          echo "===== نصوص about الحالية ====="
          grep -rn "about\|About\|developer\|Developer\|مطور" --include="strings.xml" . 2>/dev/null | head -40
          
          # محاولة استبدال المفاتيح الشائعة
          for KEY in developer_name developer developer_credit about_developer \
                     settings_developer_name settings_about_developer \
                     settings_about_developer_name author created_by app_author \
                     settings_about_developer_credit about_credits; do
            find . -name "strings.xml" -exec sed -i "s|<string name=\"$KEY\">[^<]*</string>|<string name=\"$KEY\">جلولي مصطفى</string>|g" {} +
          done
          
          echo "✅ تم تعديل مفاتيح المطور المعروفة"

      # ============================================================
      # Build
      # ============================================================
      - name: Setup Gradle properties
        working-directory: source
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Grant execute permission for gradlew
        working-directory: source
        run: chmod +x gradlew

      - name: Build ARM APK
        working-directory: source
        run: ./gradlew assembleStandardDebug --stacktrace --no-daemon --no-parallel

      - name: Upload ARM APK
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-ARM-APK
          path: 'source/app/build/outputs/apk/standard/debug/*.apk'
          if-no-files-found: error
