name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest stable tag
        id: tag
        run: |
          LATEST=$(curl -s "https://api.github.com/repos/ahXN00/OwnTV/tags" | grep -oP '"name":\s*"\K[^"]+' | head -1)
          echo "tag=$LATEST" >> $GITHUB_OUTPUT

      - name: Checkout upstream OwnTV
        uses: actions/checkout@v4
        with:
          repository: ahXN00/OwnTV
          ref: ${{ steps.tag.outputs.tag }}
          path: source
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick fonts-dejavu

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-v4-${{ steps.tag.outputs.tag }}-${{ hashFiles('source/**/*.gradle*', 'source/**/gradle-wrapper.properties') }}
          restore-keys: sttiten-v4-${{ steps.tag.outputs.tag }}-

      # ============================================================
      # 🔍 الخطوة التشخيصية
      # ============================================================
      - name: Diagnostic
        working-directory: source
        run: |
          echo "===== [1] wordmark files ====="
          find . -name "*wordmark*" -exec ls -la {} \;
          
          echo ""
          echo "===== [2] BrandLockup.kt ====="
          find . -name "BrandLockup.kt" -exec cat {} \; 2>/dev/null | head -80
          
          echo ""
          echo "===== [3] About / Developer strings ====="
          grep -rn "about\|About\|developer\|Developer\|مطور" --include="strings.xml" . 2>/dev/null | head -30

      # ============================================================
      # ✂️ المهمة 1: إنشاء لوجو STTITEN IP TV واستبدال الملفين
      # ============================================================
      - name: Create STTITEN IP TV logo
        working-directory: source
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          
          # إنشاء PNG بخلفية شفافة مع نص أبيض عريض
          convert -size 1200x300 xc:transparent \
            -font DejaVu-Sans-Bold -pointsize 110 \
            -fill "#FFFFFF" -gravity center \
            -annotate +0+0 "STTITEN IP TV" \
            app/src/main/res/drawable-nodpi/sttiten_logo.png
          
          ls -la app/src/main/res/drawable-nodpi/sttiten_logo.png
          echo "✅ تم إنشاء الشعار"
          
          mkdir -p app/src/main/res/drawable
          
          # استبدال owntv_wordmark_own.xml (الكلمة الأولى)
          cat > app/src/main/res/drawable/owntv_wordmark_own.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable/sttiten_logo"
              android:gravity="center" />
          EOF
          
          # استبدال owntv_wordmark_tv.xml (الكلمة الثانية) بشفاف
          cat > app/src/main/res/drawable/owntv_wordmark_tv.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <size android:width="0dp" android:height="0dp" />
              <solid android:color="#00000000" />
          </shape>
          EOF
          
          echo "✅ تم استبدال ملفي wordmark"

      # ============================================================
      # ✂️ المهمة 2: دعم اللغة العربية فقط
      # ============================================================
      - name: Restrict to Arabic only
        working-directory: source
        run: |
          # تعديل build.gradle.kts الخاص بالتطبيق
          APP_GRADLE="app/build.gradle.kts"
          
          if [ -f "$APP_GRADLE" ]; then
            echo "===== قبل التعديل ====="
            grep -A 5 "defaultConfig {" "$APP_GRADLE" | head -20
            
            # إضافة resourceConfigurations داخل defaultConfig
            # نستخدم perl للتعامل مع النص متعدد الأسطر
            perl -i -pe 's/(defaultConfig\s*\{)/$1\n        resourceConfigurations += listOf("ar")/' "$APP_GRADLE"
            
            echo "===== بعد التعديل ====="
            grep -A 3 "defaultConfig {" "$APP_GRADLE" | head -10
            echo "✅ تم تفعيل اللغة العربية فقط"
          else
            echo "⚠️ لم يتم العثور على $APP_GRADLE"
          fi

      # ============================================================
      # ✂️ المهمة 3: تعديل قسم "حول التطبيق"
      # ============================================================
      - name: Replace About section
        working-directory: source
        run: |
          # استبدال كل النصوص المشابهة لمعلومات المطور
          for KEY in developer_name developer developer_credit about_developer settings_developer_name settings_about_developer settings_about_developer_name author created_by app_author ; do
            find . -name "strings.xml" -exec sed -i "s|<string name=\"$KEY\">[^<]*</string>|<string name=\"$KEY\">جلولي مصطفى</string>|g" {} +
            find . -name "strings.xml" -exec sed -i "s|<string name=\"$KEY\" translatable=\"false\">[^<]*</string>|<string name=\"$KEY\" translatable=\"false\">جلولي مصطفى</string>|g" {} +
          done
          
          # إزالة أي سطر يحتوي على البريد الإلكتروني أو روابط في قسم about
          echo "✅ تم تعديل معلومات المطور"
          
          # عرض النتيجة
          echo "===== نصوص About بعد التعديل ====="
          grep -rn "جلولي مصطفى" --include="strings.xml" . 2>/dev/null | head -10 || echo "لم يتم تعديل أي مفتاح معروف"
          
          echo ""
          echo "===== النصوص التي تحتوي about/developer ====="
          grep -rn "about\|About\|developer\|Developer" --include="strings.xml" . 2>/dev/null | head -30

      # ============================================================
      # Build
      # ============================================================
      - name: Change App Name to STTITEN IP TV
        working-directory: source
        run: |
          find . -name "strings.xml" -exec sed -i 's|<string name="app_name">[^<]*</string>|<string name="app_name">STTITEN IP TV</string>|g' {} +
          find . -name "*.kt" -exec sed -i 's|"OwnTV"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"Own TV"|"STTITEN IP TV"|g' {} +

      - name: Setup Gradle properties
        working-directory: source
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Grant execute permission for gradlew
        working-directory: source
        run: chmod +x gradlew

      - name: Build ARM APK
        working-directory: source
        run: ./gradlew assembleStandardDebug --stacktrace --no-daemon --no-parallel

      - name: Upload ARM APK
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-ARM-APK
          path: 'source/app/build/outputs/apk/standard/debug/*.apk'
          if-no-files-found: error
