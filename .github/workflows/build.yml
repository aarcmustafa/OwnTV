name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Install required Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # ✅ الخطوة الجديدة: دعم معماريات 32-bit و 64-bit
      - name: Enable 32-bit and 64-bit Architectures
        run: |
          # البحث عن ملف build.gradle الخاص بوحدة التطبيق (app) وإضافة إعدادات المعمارية
          # ملاحظة: يقوم هذا الأمر بإضافة ndk { abiFilters ... } داخل defaultConfig
          find . -name "build.gradle" -path "*/app/*" -exec sed -i '/defaultConfig {/a \        ndk {\n            abiFilters "armeabi-v7a", "arm64-v8a"\n        }' {} +
          
          # في حال كان المشروع يستخدم Kotlin DSL (build.gradle.kts)
          find . -name "build.gradle.kts" -path "*/app/*" -exec sed -i '/defaultConfig {/a \        ndk {\n            abiFilters("armeabi-v7a", "arm64-v8a")\n        }' {} +
          
          echo "✅ تم تفعيل دعم 32-bit (armeabi-v7a) و 64-bit (arm64-v8a)"

      - name: Change App Name to STTITEN IP TV
        run: |
          find . -name "strings.xml" -exec sed -i 's|<string name="app_name">.*</string>|<string name="app_name">STTITEN IP TV</string>|g' {} +
          find . -name "*.kt" -exec sed -i 's|"OwnTV"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"Own TV"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"OwnTv"|"STTITEN IP TV"|g' {} +
          echo "✅ تم تغيير الاسم إلى STTITEN IP TV"

      - name: Setup Gradle properties
        run: |
          echo "org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-Debug-APK
          path: '**/*.apk'
