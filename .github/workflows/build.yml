name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # يسمح بتشغيله يدوياً من واجهة GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Change App Name to STTITEN IP TV
        run: |
          # البحث عن جميع ملفات strings.xml وتعديل اسم التطبيق
          find . -name "strings.xml" -path "*/values*/*" -exec sed -i 's|<string name="app_name">.*</string>|<string name="app_name">STTITEN IP TV</string>|g' {} +
          echo "تم تغيير اسم التطبيق إلى STTITEN IP TV بنجاح"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-Debug-APK
          path: '**/*.apk'
