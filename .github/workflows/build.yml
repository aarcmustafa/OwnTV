name: Build STTITEN IP TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest stable tag
        id: tag
        run: |
          LATEST=$(curl -s "https://api.github.com/repos/ahXN00/OwnTV/tags" | grep -oP '"name":\s*"\K[^"]+' | head -1)
          echo "tag=$LATEST" >> $GITHUB_OUTPUT

      - name: Checkout upstream OwnTV
        uses: actions/checkout@v4
        with:
          repository: ahXN00/OwnTV
          ref: ${{ steps.tag.outputs.tag }}
          path: source
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          java-package: 'jdk'
          architecture: 'x64'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install required Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || \
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: sttiten-v3-${{ steps.tag.outputs.tag }}-${{ hashFiles('source/**/*.gradle*', 'source/**/gradle-wrapper.properties') }}
          restore-keys: sttiten-v3-${{ steps.tag.outputs.tag }}-

      # ============================================================
      # 🔍 الخطوة التشخيصية: نبحث عن كل ما نحتاج تعديله ونطبعه
      # ============================================================
      - name: Diagnostic - Find all targets
        working-directory: source
        run: |
          echo "========== [1] مراجع telegram_qr في الكود =========="
          grep -rn "telegram_qr" --include="*.kt" --include="*.xml" . 2>/dev/null || echo "لا توجد مراجع"
          
          echo ""
          echo "========== [2] جميع نصوص strings.xml التي تحتوي OwnTV =========="
          grep -rn "OwnTV\|Own TV\|Own Tv\|Owntv" --include="strings.xml" . 2>/dev/null | head -30 || echo "لا يوجد"
          
          echo ""
          echo "========== [3] نصوص حول/المطور في strings.xml =========="
          grep -rhn "developer\|Developer\|مطور\|about_developer\|settings_about\|about_name" --include="strings.xml" . 2>/dev/null | head -40 || echo "لا يوجد"
          
          echo ""
          echo "========== [4] ملفات Kotlin التي تحتوي OwnTV كنص حرفي =========="
          grep -rln '"OwnTV"\|"Own TV"\|"Own Tv"\|"OwnTv"' --include="*.kt" . 2>/dev/null || echo "لا يوجد"
          
          echo ""
          echo "========== [5] أين يظهر "حول التطبيق" في الكود =========="
          grep -rln "about\|About\|حول" --include="*.kt" . 2>/dev/null | head -20 || echo "لا يوجد"

      # ============================================================
      # ✂️ المهمة 1: إزالة صورة Telegram QR وكل مراجعها
      # ============================================================
      - name: Task 1 - Remove Telegram QR image and references
        working-directory: source
        run: |
          # حذف الصورة من جميع المجلدات
          find . -name "telegram_qr.jpg" -delete
          find . -name "telegram_qr.png" -delete
          find . -name "telegram_qr.xml" -delete
          echo "✅ تم حذف صورة Telegram QR"
          
          # استبدال مراجع R.drawable.telegram_qr بـ R.drawable.ic_launcher_foreground
          # (نستخدم أي drawable موجود لتفادي خطأ البناء)
          find . -name "*.kt" -exec sed -i 's|R\.drawable\.telegram_qr|R.drawable.owntv_wordmark|g' {} + 2>/dev/null || true
          find . -name "*.xml" -exec sed -i 's|@drawable/telegram_qr|@drawable/owntv_wordmark|g' {} + 2>/dev/null || true
          
          echo "✅ تم استبدال مراجع Telegram QR"
          
          # عرض المراجع المتبقية للتأكد
          echo "--- المراجع المتبقية ---"
          grep -rn "telegram_qr" --include="*.kt" --include="*.xml" . 2>/dev/null || echo "لا يوجد ✅"

      # ============================================================
      # ✂️ المهمة 2: استبدال كل كتابات OwnTV في الواجهات
      # ============================================================
      - name: Task 2 - Replace OwnTV in user-facing strings
        working-directory: source
        run: |
          # استبدال في جميع ملفات strings.xml (كل اللغات)
          find . -name "strings.xml" -exec sed -i 's|>OwnTV<|>STTITEN IP TV<|g' {} +
          find . -name "strings.xml" -exec sed -i 's|>Own TV<|>STTITEN IP TV<|g' {} +
          find . -name "strings.xml" -exec sed -i 's|>Own Tv<|>STTITEN IP TV<|g' {} +
          find . -name "strings.xml" -exec sed -i 's|>Owntv<|>STTITEN IP TV<|g' {} +
          find . -name "strings.xml" -exec sed -i 's|>OWNTV<|>STTITEN IP TV<|g' {} +
          find . -name "strings.xml" -exec sed -i 's|>OwnTv<|>STTITEN IP TV<|g' {} +
          echo "✅ تم تعديل strings.xml"
          
          # استبدال في النصوص الحرفية داخل Kotlin
          # فقط عندما تكون الكلمة بين علامتي تنصيص كاملتين (لتفادي تعديل أسماء الحزم)
          find . -name "*.kt" -exec sed -i 's|"OwnTV"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"Own TV"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"Own Tv"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"OwnTv"|"STTITEN IP TV"|g' {} +
          find . -name "*.kt" -exec sed -i 's|"OWNTV"|"STTITEN IP TV"|g' {} +
          echo "✅ تم تعديل ملفات Kotlin"

      # ============================================================
      # ✂️ المهمة 3: استبدال معلومات المطور في قسم "حول"
      # ============================================================
      - name: Task 3 - Replace developer info
        working-directory: source
        run: |
          # استبدال نصوص شائعة للمطور في strings.xml
          # سنستبدل أي قيمة تحتوي كلمات مفتاحية للمطور
          
          # نستبدل عبر إيجاد أسطر تحتوي developer/مطور ونغير قيمة النص
          # هذه قائمة شاملة للأسماء المحتملة
          for KEY in \
            "developer_name" "about_developer" "settings_about_developer" \
            "settings_developer_name" "about_developer_name" "developer" \
            "settings_about_developer_name" "app_developer" "created_by" \
            "author" "settings_author" ; do
            
            find . -name "strings.xml" -exec sed -i "s|<string name=\"$KEY\">[^<]*</string>|<string name=\"$KEY\">جلولي مصطفى</string>|g" {} +
          done
          
          echo "✅ تم تعديل نصوص المطور (المحاولة الأولى)"
          
          # عرض النتائج للتأكد
          echo "--- ما تم تعديله ---"
          grep -rn "جلولي مصطفى" --include="strings.xml" . 2>/dev/null || echo "لم يتم تعديل أي شيء بعد"
          
          # نبحث عن أي string يحتوي "مطور" أو "Developer" لعرض قيمته الأصلية
          echo ""
          echo "--- نصوص تحتوي 'مطور' أو 'Developer' ---"
          grep -rn "مطور\|Developer\|developer" --include="strings.xml" . 2>/dev/null | head -20

      # ============================================================
      # Build
      # ============================================================
      - name: Setup Gradle properties
        working-directory: source
        run: |
          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties

      - name: Grant execute permission for gradlew
        working-directory: source
        run: chmod +x gradlew

      - name: Build ARM APK
        working-directory: source
        run: |
          ./gradlew assembleStandardDebug --stacktrace --no-daemon --no-parallel

      - name: Upload ARM APK
        uses: actions/upload-artifact@v4
        with:
          name: STTITEN-IP-TV-ARM-APK
          path: 'source/app/build/outputs/apk/standard/debug/*.apk'
          if-no-files-found: error
